<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Edit Profile • OhidBook</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="top">

  <div class="brand">
    OhidBook
  </div>

  <nav class="nav">

    <a href="index.html">
      Home
    </a>

    <a href="profile.html">
      Profile
    </a>

  </nav>

</header>


<main>

  <div class="form-box">

    <h2 style="margin-bottom:20px;">
      ✏ Edit Profile
    </h2>

    <form id="form">

      <label>Full name</label>

      <input
        id="fullName"
        type="text"
        required
      >


      <label>Username</label>

      <input
        id="username"
        type="text"
        required
      >


      <label>Bio</label>

      <textarea
        id="bio"
        placeholder="Tell people about yourself..."
      ></textarea>


      <label>Profile picture</label>

      <input
        id="avatar"
        type="file"
        accept="image/*"
      >


      <label>Cover photo</label>

      <input
        id="cover"
        type="file"
        accept="image/*"
      >


      <button
        id="saveBtn"
        type="submit"
        style="width:100%;"
      >
        💾 Save Changes
      </button>

    </form>

    <p
      id="message"
      style="
        text-align:center;
        margin-top:15px;
      "
    ></p>

  </div>

</main>


<script type="module">

import {
  supabase
} from "./supabase.js";

import {
  getUser,
  getProfile,
  uploadMedia,
  showMessage
} from "./app.js";


let user;

async function init(){

  user = await getUser();

  if(!user){

    location.href="login.html";

    return;
  }

  const profile =
    await getProfile(user.id);

  if(profile){

    document.getElementById("fullName").value =
      profile.full_name || "";

    document.getElementById("username").value =
      profile.username || "";

    document.getElementById("bio").value =
      profile.bio || "";
  }

}

document
  .getElementById("form")
  .addEventListener("submit", async (e) => {

    e.preventDefault();

    const btn =
      document.getElementById("saveBtn");

    btn.disabled = true;
    btn.textContent = "Saving...";

    try{

      const fullName =
        document
          .getElementById("fullName")
          .value
          .trim();

      const username =
        document
          .getElementById("username")
          .value
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9_]/g,"");

      const bio =
        document
          .getElementById("bio")
          .value
          .trim();

      const avatarFile =
        document
          .getElementById("avatar")
          .files[0];

      const coverFile =
        document
          .getElementById("cover")
          .files[0];


      let avatarUrl;
      let coverUrl;

      const oldProfile =
        await getProfile(user.id);


      if(avatarFile){

        avatarUrl =
          await uploadMedia(
            avatarFile,
            `avatars/${user.id}`
          );

      }else{

        avatarUrl =
          oldProfile?.avatar_url || null;

      }


      if(coverFile){

        coverUrl =
          await uploadMedia(
            coverFile,
            `covers/${user.id}`
          );

      }else{

        coverUrl =
          oldProfile?.cover_url || null;

      }


      const { error } =
        await supabase
          .from("profiles")
          .update({
            full_name:fullName,
            username,
            bio,
            avatar_url:avatarUrl,
            cover_url:coverUrl,
            updated_at:new Date().toISOString()
          })
          .eq("id",user.id);

      if(error){

        throw error;
      }

      showMessage(
        "Profile updated!",
        "success"
      );

      setTimeout(() => {

        location.href =
          `profile.html?id=${user.id}`;

      },1000);

    }catch(error){

      console.error(error);

      showMessage(error.message);

    }finally{

      btn.disabled = false;
      btn.textContent = "💾 Save Changes";

    }

  });


init();

</script>

</body>
</html>
